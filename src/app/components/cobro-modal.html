<div class="modal-overlay" (click)="cancelar()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <h2 class="modal-title">Cobro en Efectivo</h2>

    <!-- Total a pagar -->
    <div class="total-box">
      <span class="total-label">Total a Pagar</span>
      <p class="total-amount">${{ totalAPagar() | number:'1.2-2' }}</p>
    </div>

    <!-- Campo: Con cuánto paga -->
    <div class="input-group">
      <label for="pago">¿Con cuánto paga el cliente?</label>
      <div class="input-wrapper">
        <span class="currency-symbol">$</span>
        <input
          id="pago"
          type="number"
          step="0.01"
          placeholder="0.00"
          [ngModel]="montoIngresado()"
          (ngModelChange)="montoIngresado.set($event)"
          class="input-monto"
          autofocus
        />
      </div>
    </div>

    <!-- Indicador de Vuelto o Faltante -->
    @if (montoIngresado() !== null && montoIngresado()! > 0) {
      <div class="result-box">
        @if (pagoSuficiente()) {
          <!-- VUELTO A ENTREGAR (Verde) -->
          <div class="status-card status-vuelto">
            <span>Vuelto a entregar:</span>
            <p>${{ diferencia() | number:'1.2-2' }}</p>
          </div>
        } @else {
          <!-- DINERO FALTANTE (Rojo/Naranja) -->
          <div class="status-card status-faltante">
            <span>Falta cobrar:</span>
            <p>${{ (diferencia() * -1) | number:'1.2-2' }}</p>
          </div>
        }
      </div>
    }

    <!-- Botones de Acción -->
    <div class="button-group">
      <button type="button" class="btn-cancel" (click)="cancelar()">
        Cancelar
      </button>

      <button
        type="button"
        class="btn-confirm"
        [disabled]="!pagoSuficiente()"
        (click)="confirmar()"
      >
        Finalizar Venta
      </button>
    </div>

  </div>
</div>
