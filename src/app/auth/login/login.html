<div class="login-container">
  @if (!isRegisterMode) {
    <!-- Formulario de Login -->
    <div class="card">
      <h2>Iniciar Sesión</h2>
      <form (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="loginLegajo">Legajo</label>
          <input
            type="number"
            id="loginLegajo"
            [(ngModel)]="loginData.legajo"
            name="loginLegajo"
            required
            placeholder="Ingrese su legajo"
          />
        </div>

        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input
            type="password"
            id="loginPassword"
            [(ngModel)]="loginData.password"
            name="loginPassword"
            required
            placeholder="Ingrese su contraseña"
          />
        </div>

        @if (errorMessage) {
          <div class="error-box">
            {{ errorMessage }}
          </div>
        }

        <button type="submit" class="btn btn-primary">Ingresar</button>
      </form>

      <p class="toggle-text">
        ¿No tenés cuenta?
        <button type="button" class="btn-link" (click)="toggleMode()">Registrate acá</button>
      </p>
    </div>
  } @else {
    <!-- Formulario de Registro -->
    <div class="card">
  <h2>Crear Cuenta</h2>
  <form (ngSubmit)="onRegister()">
    <div class="form-group">
      <label for="regLegajo">Legajo</label>
      <input
        type="number"
        id="regLegajo"
        [(ngModel)]="registerData.legajo"
        name="regLegajo"
        required
        placeholder="Ingrese su legajo"
      />
    </div>

    <div class="form-group">
      <label for="regName">Nombre y Apellido</label>
      <input
        type="text"
        id="regName"
        [(ngModel)]="registerData.name"
        name="regName"
        required
        placeholder="Ingrese su nombre"
      />
    </div>

    <div class="form-group">
      <label for="regPassword">Contraseña</label>
      <input
        type="password"
        id="regPassword"
        [(ngModel)]="registerData.password"
        name="regPassword"
        required
        placeholder="Cree una contraseña"
      />
    </div>

    <div class="form-group">
      <label for="regRol">Rol</label>
      <select id="regRol" [(ngModel)]="registerData.rol" name="regRol">
        <option value="CASHIER">Cajero / Operador</option>
        <option value="ADMIN">Administrador</option>
      </select>
    </div>

    @if (errorMessage) {
      <div class="error-box">
        {{ errorMessage }}
      </div>
    }

    <button type="submit" class="btn btn-success">Registrarse</button>
  </form>

  <p class="toggle-text">
    ¿Ya tenés cuenta?
    <button type="button" class="btn-link" (click)="toggleMode()">Iniciá sesión</button>
  </p>
</div>
  }
</div>
